[project]
name = "adaptive-gaussian-fwi"
version = "0.1.0"
description = "Adaptive Gaussian parametrization for seismic macro-velocity inversion."
requires-python = ">=3.12"
dependencies = [
    "deepwave>=0.0.27",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "torch>=2.14.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
